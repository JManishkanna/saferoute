server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: saferoute
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/saferoute}
  jackson:
    default-property-inclusion: non_null

saferoute:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-change-this-before-deployment-123456789}
    expiration-ms: 86400000
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
