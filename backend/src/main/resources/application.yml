server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: saferoute
  datasource:
    url: ${SUPABASE_JDBC_URL:jdbc:postgresql://localhost:5432/saferoute?sslmode=require}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

saferoute:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-change-this-before-deployment-123456789}
    expiration-ms: 86400000
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
